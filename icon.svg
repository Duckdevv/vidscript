<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>VidScript - Frame, Braces and Growing Dots</title>
  <defs>
    <linearGradient id="frameGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7b00"/>
      <stop offset="1" stop-color="#ff7b00"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="#0E1116"/>

  <!-- 16:9 frame (video) -->
  <rect x="76" y="104" width="360" height="202.5" rx="26" fill="none" stroke="url(#frameGrad)" stroke-width="16"/>

  <!-- braces (code) -->
  <path d="M170 150 Q150 150 150 170 L150 190 Q150 205 130 205 Q150 205 150 220 L150 240 Q150 260 170 260" fill="none" stroke="#E6EDF3" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M342 150 Q362 150 362 170 L362 190 Q362 205 382 205 Q362 205 362 220 L362 240 Q362 260 342 260" fill="none" stroke="#E6EDF3" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- three growing dots (time, property, value) -->
  <circle cx="206" cy="205" r="8" fill="#ff922c" fill-opacity="0.55"/>
  <circle cx="249" cy="205" r="13" fill="#ff8310" fill-opacity="0.8"/>
  <circle cx="296" cy="205" r="19" fill="#ff7b00"/>

  <!-- wordmark -->
  <text x="256" y="424" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="54" font-weight="700" fill="#E6EDF3">VidScript<tspan fill="#ff7b00">!</tspan></text>
</svg>
